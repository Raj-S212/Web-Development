<head>

    /* .boxes *{

    /* .box:nth-child(even){

    .boxes::after{
        content: "I am a before pseudo element";
        color: red;
    }

    .boxes::selection{
        color: white;
        background-color: red;
    }

    .box::first-letter{
        color: red;
        font-size: 30px;
    }
    .input::placeholder{
        color: rgba(255, 0, 0, 0.39);
        font-size: 20px;
    }
    .input::target-text{
        color: red;
    }
    </style>
</head>
<body>
    <div class="boxes">
    <div data-color="primary" class="box">I am a first box </div>
    <div class="box">Hey I am a box </div>
    <div class="box">Hey I am a box </div>
    <input type="text" name="name" id="name" placeholder="Enter your name">
    </div>
</body>

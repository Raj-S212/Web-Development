<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadow</title>
    <style>
        .box{
            border: 2px solid black;
            padding: 30px;
            box-shadow: 5px 5px 9px rgb(200, 82, 82);
            text-shadow: 2px 2px 10px rgb(141, 18, 163);
            outline: 2px solid rgb(144, 39, 201);
        }
    </style>
</head>
<body>
    <div class = "box">
       I am a box
    </div>
    
</body>
</html>

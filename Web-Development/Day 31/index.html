<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create nav bar</title>
    <style>
        :root{
            --primary-color: var( #a032b6);
            --text-color:var( white);
            --secondary-color: var( #c88de5);
        }
        *{
            margin: 0;
            padding: 0;
            font-family:'Poppins', sans-serif;
        }
        nav{
            background-color: #a032b6;
            color: white;
            padding: 10px 0px;
        }

        ul li{
            List-style: none;
            display: inline;
            padding: 25px;;
            color: white;
            font-weight: bolder;
            color: var(--text-color);
        }

        ul li a{
            text-decoration: none;
            color: var(--text-color);
        }

    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
</body>
</html>

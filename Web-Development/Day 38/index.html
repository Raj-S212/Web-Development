<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Animation</title>
    <style>
     .container{
      background-color: rgb(8, 80, 11);
        width: 80vw;
        height: 30vh; 
     }

     .box{
       
        width: 34px;
        height: 45px;
        /*
        animation: rajkaAnimation;
        animation-duration: 3s;
        animation-iteration-count: 3;
        animation-timing-function: ease-out;
        animation-delay: 10; */
        animation: rajkaAnimation 3s ease-in-out 3s 1 ,
                            raj2  3s ease-in-out 3s 1 ;

     }

     @keyframes rajkaAnimation{
        from{
            background-color: red;
        }
        to{
            background-color: yellow;
        }
     }

     @keyframes raj2 {
        0%{
            transform: rotate(100deg);
        }
        20%{
            transform: rotate(200deg);
        }
        50%{
            transform: rotate(220deg);
        }
        80%{
            transform: rotate(300deg);
        }
        100%{
            transform: rotate(310deg);
        }


     }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
        Box
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS FILTER</title>
    <style>
        /* img{
          filter: blur(5px)
        } */
        .img1{
             filter: brightness(150%);
        }

        .img2{
             filter: contrast(200%);
        }

        .img3{
                filter: grayscale(100%);
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="img1" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSICmPX7HVrXVG2gS_IWLY_caJf42RHkS3GgaBlU_cUAQ&s=10" alt="">

        <img class="img2" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTyZqEDGAVVFGsgjDUF4C3Ph_l_7MyC24dffZXsKmyp96DsshyixweNukg&s=10" alt="">

        <img class="img3" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSa3nSTc6tmlEouZ21L2bGEoYWuwPFy8ESf3Hpt6HKEYw&s=10" alt="">

    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS OBJECT FIT AND POSITION</title>
    <style>
        .container{
        height: 400px;
        width: 500px;
        border: 2px solid black;
        background-color: rgb(106, 138, 138);
        }
        img{
            height: 100%;
            width: 100%;
            object-fit: cover;
            object-position : top right;
            /* object-fit :contain; */
        }
    </style>
    
</head>
<body>
    <div class="container">
        <img src="https://img.magnific.com/free-photo/closeup-shot-beautiful-butterfly-with-interesting-textures-orange-petaled-flower_181624-7640.jpg?semt=ais_hybrid&w=740&q=80"
    </div>
</body>
</html>
